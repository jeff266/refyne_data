# Company Name Normalizer
# Normalizes company names with canonical suffix forms (Option C - do NOT strip suffixes)

id: company-name
version: 1.0.0
name: Company Name Normalizer
description: Normalizes company names by cleaning whitespace, title-casing, and normalizing legal suffixes to canonical forms (Corp., Inc., LLC, etc.)
category: business-entities
author: revops-impact
transformFunction: smart_title_case

transformConfig:
  honorHyphenBoundary: true
  preserveDigitTokens: true

  conjunctions:
    - and
    - or
    - the
    - of
    - in
    - for
    - with
    - at
    - by
    - to
    - a
    - an
    - but
    - nor
    - so
    - yet
    - as

  brandTokens:
    - iPhone
    - iPad
    - iMac
    - iPod
    - iCloud
    - macOS
    - iOS
    - watchOS
    - tvOS
    - eBay
    - eCommerce
    - eLearning
    - eHealth
    - PayPal
    - LinkedIn
    - GitHub
    - GitLab
    - YouTube
    - HubSpot
    - Salesforce
    - WordPress
    - WooCommerce
    - TypeScript
    - JavaScript
    - PostgreSQL
    - MySQL
    - MongoDB
    - Redis
    - OpenAI
    - ChatGPT
    - OAuth
    - GraphQL
    - DevOps
    - DevSecOps
    - FinTech
    - HealthTech
    - PropTech
    - InsurTech
    - LegalTech
    - EdTech
    - AdTech
    - MarTech
    - RegTech
    - CleanTech
    - MedTech
    - GmbH
    - GbR
    - OHG
    - KGaA
    - SARL
    - SAS
    - EURL
    - SpA
    - Srl
    - SrL
    - Ltda
    - Ltée
    - ApS
    - BV
    - NV
    - VOF
    - VZW
    - Pty
    - KK
    - ULC

applies_to:
  fields:
    - company.name
  entity: company

ruleExplanation: "Normalizing company name from '{{oldValue}}' to '{{newValue}}' (suffix standardization, title case)"

sources: []

rules:
  - id: null-passthrough
    description: Pass through null values unchanged
    when: value = null
    transform: "null"

  - id: empty-passthrough
    description: Pass through empty strings unchanged
    when: value = ""
    transform: '""'

  - id: normalize-name
    description: Clean whitespace, smart title case (preserving acronyms), and normalize suffixes
    transform: |
      (
        $cleaned := $clean_whitespace(value);

        /* Detect if input has mixed case (not all uppercase) */
        $inputHasLower := $exists($match($cleaned, /[a-z]/));

        /* Smart title case that preserves acronyms and handles conjunctions */
        $words := $split($cleaned, /\s+/);
        $titleCased := $map($words, function($word, $index) {
          (
            /* Conjunctions and prepositions (lowercase unless first word) */
            $isConjunction := $lowercase($word) in ["and", "or", "the", "of", "in", "for", "with", "at", "by", "to"];
            $shouldLowercase := $isConjunction and $index > 0;

            /* Preserve 2-3 char acronyms, 4-5 char only if mixed input */
            $isShortAcronym := $exists($match($word, /^[A-Z]{2,3}$/));
            $isLongAcronym := $inputHasLower and $exists($match($word, /^[A-Z]{4,5}$/));
            $isAcronym := ($isShortAcronym or $isLongAcronym) and $not($isConjunction);

            /* Preserve intentional mixed case like iPhone (lowercase + uppercase + 2+ lowercase) */
            $isMixedCase := $exists($match($word, /^[a-z]+[A-Z][a-z]{2,}/));

            $shouldLowercase ? $lowercase($word) :
            $isAcronym ? $uppercase($word) :
            $isMixedCase ? $word :
            $normalize_case($word, "title")
          )
        });
        $titled := $join($titleCased, " ");

        /* Suffix mapping - normalize to canonical forms */
        /* US Forms */
        $s1 := $replace($titled, /\bCorporation\b$/i, "Corp.");
        $s2 := $replace($s1, /\bIncorporated\b$/i, "Inc.");
        $s3 := $replace($s2, /\bLimited Liability Company\b$/i, "LLC");
        $s4 := $replace($s3, /\bLimited\b$/i, "Ltd.");
        $s5 := $replace($s4, /\bCompany\b$/i, "Co.");

        /* Normalize existing abbreviated forms */
        $s6 := $replace($s5, /,?\s*Inc\.?$/i, " Inc.");
        $s7 := $replace($s6, /,?\s*Corp\.?$/i, " Corp.");
        $s8 := $replace($s7, /,?\s*LLC\.?$/i, " LLC");
        $s9 := $replace($s8, /,?\s*Ltd\.?$/i, " Ltd.");
        $s10 := $replace($s9, /,?\s*Co\.?$/i, " Co.");

        /* International forms - normalize spacing/dots */
        $s11 := $replace($s10, /\bGmbH\b/i, "GmbH");
        $s12 := $replace($s11, /\bAG\b/i, "AG");
        $s13 := $replace($s12, /\bS\.?A\.?\b/i, "S.A.");
        $s14 := $replace($s13, /\bPty\.?\s*Ltd\.?/i, "Pty Ltd.");
        $s15 := $replace($s14, /\bPLC\b/i, "PLC");
        $s16 := $replace($s15, /\bB\.?V\.?\b/i, "B.V.");
        $s17 := $replace($s16, /\bN\.?V\.?\b/i, "N.V.");

        /* Handle "The" prefix - move to consistent position */
        $s18 := $replace($s17, /^The\s+/i, "");
        $hasThe := $match($lowercase($titled), /^the\s/).matched;
        $final := $hasThe ? "The " & $s18 : $s17;

        /* Clean any double spaces from replacements */
        $trim($replace($final, /\s+/, " "))
      )

tests:
  - name: Null input passes through
    input: null
    expected: null

  - name: Empty string passes through
    input: ""
    expected: ""

  - name: Normalizes Corporation to Corp.
    input: "ACME CORPORATION"
    expected: "Acme Corp."

  - name: Normalizes Incorporated to Inc.
    input: "TechStart Incorporated"
    expected: "Techstart Inc."

  - name: Keeps LLC suffix normalized
    input: "Awesome Ventures, LLC"
    expected: "Awesome Ventures LLC"

  - name: Normalizes Limited to Ltd.
    input: "British Telecom Limited"
    expected: "British Telecom Ltd."

  - name: Keeps GmbH as-is
    input: "SIEMENS GMBH"
    expected: "Siemens GmbH"

  - name: Normalizes S.A. format
    input: "Banco Santander SA"
    expected: "Banco Santander S.A."

  - name: Normalizes Pty Ltd format
    input: "Atlassian PTY LTD"
    expected: "Atlassian Pty Ltd."

  - name: Normalizes B.V. format
    input: "Philips BV"
    expected: "Philips B.V."

  - name: Handles The prefix consistently
    input: "THE WALT DISNEY COMPANY"
    expected: "The Walt Disney Co."

  - name: Cleans excess whitespace
    input: "   EXAMPLE    COMPANY   "
    expected: "Example Co."

  - name: Mixed case normalization
    input: "mY cOMpaNY nAmE"
    expected: "My Company Name"

  - name: Preserves ALL CAPS acronyms
    input: "Specialized ABA Services"
    expected: "Specialized ABA Services"

  - name: Preserves ALL CAPS brand names (2-4 chars)
    input: "LEARN Behavioral"
    expected: "LEARN Behavioral"

  - name: Lowercases conjunctions (not first word)
    input: "Pisecco AND Associates"
    expected: "Pisecco and Associates"

  - name: Preserves mixed case brand names
    input: "iPhone Repair Co"
    expected: "iPhone Repair Co."

  - name: Multiple conjunctions lowercase
    input: "The Company Of The Future"
    expected: "The Company of the Future"

  - name: Acronyms with suffixes
    input: "ABC LLC"
    expected: "ABC LLC"

on_error: fail-silent-log
default_enabled: true
tags:
  - company
  - normalization
  - name
  - suffix
