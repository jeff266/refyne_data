# Contact Title Standardizer
# Standardizes job titles to common formats

id: contact-title-standard
version: 1.0.0
name: Contact Title Standardizer
description: Standardizes job titles by normalizing case and common abbreviations
category: contact-fields
author: revops-impact

applies_to:
  fields:
    - person.job_title
  entity: person

ruleExplanation: "Normalizing title from '{{oldValue}}' to '{{newValue}}' (title standardization)"

sources: []

rules:
  - id: null-passthrough
    description: Pass through null values unchanged
    when: value = null
    transform: "null"

  - id: empty-passthrough
    description: Pass through empty strings unchanged
    when: value = ""
    transform: '""'

  - id: standardize-ceo
    description: Standardize CEO variations
    when: $lowercase(value) in ["chief executive officer", "ceo"]
    transform: '"CEO"'

  - id: standardize-cto
    description: Standardize CTO variations
    when: $lowercase(value) in ["chief technology officer", "cto"]
    transform: '"CTO"'

  - id: standardize-cfo
    description: Standardize CFO variations
    when: $lowercase(value) in ["chief financial officer", "cfo"]
    transform: '"CFO"'

  - id: standardize-coo
    description: Standardize COO variations
    when: $lowercase(value) in ["chief operating officer", "coo"]
    transform: '"COO"'

  - id: standardize-cmo
    description: Standardize CMO variations
    when: $lowercase(value) in ["chief marketing officer", "cmo"]
    transform: '"CMO"'

  - id: standardize-vp-abbr
    description: Standardize V.P. abbreviation
    when: $substring($lowercase(value), 0, 4) = "v.p."
    transform: |
      (
        $lower := $lowercase(value);
        $rest := $trim($substring($lower, 4));
        $rest ? "VP " & $normalize_case($rest, "title") : "VP"
      )

  - id: standardize-vp
    description: Standardize VP prefix (vice president)
    when: |
      (
        $lower := $lowercase(value);
        $contains($lower, "vice president") or $match($lower, /^v\.?\s*p\.?\s/).matched
      )
    transform: |
      (
        $lower := $lowercase(value);
        $rest := $contains($lower, "vice president")
          ? $trim($replace($lower, /^vice president/, ""))
          : $trim($replace($lower, /^v\.?\s*p\.?/, ""));
        $rest ? "VP " & $normalize_case($rest, "title") : "VP"
      )

  - id: normalize-title-case
    description: Normalize to title case as fallback
    transform: |
      (
        $cleaned := $clean_whitespace(value);
        $normalize_case($cleaned, "title")
      )

tests:
  - name: Null input passes through
    input: null
    expected: null

  - name: Empty string passes through
    input: ""
    expected: ""

  - name: Standardizes CEO
    input: "chief executive officer"
    expected: "CEO"

  - name: Standardizes CTO
    input: "Chief Technology Officer"
    expected: "CTO"

  - name: Standardizes CFO
    input: "cfo"
    expected: "CFO"

  - name: Standardizes VP title
    input: "vice president of sales"
    expected: "VP Of Sales"

  - name: Standardizes V.P. abbreviation
    input: "V.P. Marketing"
    expected: "VP Marketing"

  - name: Normalizes non-standard title
    input: "senior software engineer"
    expected: "Senior Software Engineer"

  - name: Handles all caps
    input: "ACCOUNT MANAGER"
    expected: "Account Manager"

on_error: fail-silent-log
default_enabled: true
tags:
  - contact
  - title
  - job-title
  - normalization
