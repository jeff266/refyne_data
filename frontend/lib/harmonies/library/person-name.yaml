# Person Name Normalizer
# Parses and normalizes person names

id: person-name
version: 1.0.0
name: Person Name Normalizer
description: Parses person names from various formats ("John Smith", "Smith, John"), handles prefixes/suffixes, and normalizes to title case
category: contact-fields
author: revops-impact
transform_type: format
transform_function: smart_title_case
object_type: contact

applies_to:
  fields:
    - person.full_name
    - person.first_name
    - person.last_name
  entity: person

ruleExplanation: "Normalizing person name from '{{oldValue}}' to '{{newValue}}' (title case, whitespace cleanup)"

sources: []

rules:
  - id: null-passthrough
    description: Pass through null values unchanged
    when: value = null
    transform: "null"

  - id: empty-passthrough
    description: Pass through empty strings unchanged
    when: value = ""
    transform: '""'

  - id: parse-last-first-format
    description: Parse "Last, First" format
    when: $contains(value, ",") and $type(value) = "string"
    transform: |
      (
        $parts := $split(value, ",");
        $last := $trim($parts[0]);
        $firstPart := $trim($parts[1]);

        /* Handle suffix after first name: "Smith, John Jr." */
        $suffixPattern := /(Jr\.?|Sr\.?|III|IV|II|PhD|MD|Esq\.?|CPA)$/i;
        $suffixMatch := $match($firstPart, $suffixPattern);
        $suffix := $suffixMatch.matched ? " " & $suffixMatch.fullMatch : "";
        $first := $suffixMatch.matched ? $trim($replace($firstPart, $suffixPattern, "")) : $firstPart;

        /* Handle prefix: "Dr. John" */
        $prefixPattern := /^(Dr\.?|Mr\.?|Mrs\.?|Ms\.?|Prof\.?)\s+/i;
        $prefixMatch := $match($first, $prefixPattern);
        $prefix := $prefixMatch.matched ? $prefixMatch.fullMatch : "";
        $cleanFirst := $prefixMatch.matched ? $replace($first, $prefixPattern, "") : $first;

        $normalize_case($prefix & $cleanFirst & " " & $last & $suffix, "title")
      )

  - id: parse-standard-format
    description: Parse standard "First Last" format with prefixes/suffixes
    transform: |
      (
        $cleaned := $clean_whitespace(value);

        /* Extract and remove prefix */
        $prefixPattern := /^(Dr\.?|Mr\.?|Mrs\.?|Ms\.?|Prof\.?)\s+/i;
        $prefixMatch := $match($cleaned, $prefixPattern);
        $prefix := $prefixMatch.matched ? $prefixMatch.fullMatch : "";
        $withoutPrefix := $prefixMatch.matched ? $replace($cleaned, $prefixPattern, "") : $cleaned;

        /* Extract and remove suffix */
        $suffixPattern := /\s+(Jr\.?|Sr\.?|III|IV|II|PhD|MD|Esq\.?|CPA)$/i;
        $suffixMatch := $match($withoutPrefix, $suffixPattern);
        $suffix := $suffixMatch.matched ? $suffixMatch.fullMatch : "";
        $coreName := $suffixMatch.matched ? $replace($withoutPrefix, $suffixPattern, "") : $withoutPrefix;

        $normalize_case($prefix & $coreName & $suffix, "title")
      )

tests:
  - name: Null input passes through
    input: null
    expected: null

  - name: Empty string passes through
    input: ""
    expected: ""

  - name: Normalizes simple name
    input: "JOHN SMITH"
    expected: "John Smith"

  - name: Parses Last, First format
    input: "Smith, John"
    expected: "John Smith"

  - name: Handles Dr. prefix
    input: "Dr. Jane Doe"
    expected: "Dr. Jane Doe"

  - name: Handles Jr. suffix
    input: "John Smith Jr."
    expected: "John Smith Jr."

  - name: Handles PhD suffix
    input: "jane doe phd"
    expected: "Jane Doe Phd"

  - name: Handles Last, First Jr. format
    input: "Smith, John Jr."
    expected: "John Jr. Smith"

  - name: Handles multiple names
    input: "MARY JANE WATSON"
    expected: "Mary Jane Watson"

  - name: Handles III suffix
    input: "Robert Johnson III"
    expected: "Robert Johnson Iii"

  - name: Cleans extra whitespace
    input: "  john    doe  "
    expected: "John Doe"

on_error: fail-silent-log
default_enabled: true
tags:
  - person
  - name
  - contact
  - normalization
